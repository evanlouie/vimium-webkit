<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hostile page: hide and remove the overlay</title>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
    /*
     * The overlay host has a known name in the light DOM, so any page can
     * address it. Every property below is a way to make the interface
     * invisible while the keyboard modes keep taking keys from the user.
     *
     * An important inline declaration beats an important rule of the page, so
     * none of these may have an effect.
     */
    vimium-webkit-overlay {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      position: static !important;
      z-index: -1 !important;
      transform: scale(0) !important;
      clip-path: inset(100%) !important;
      width: 0 !important;
      height: 0 !important;
      filter: opacity(0) !important;
    }
    </style>
  </head>
  <body>
    <h1>Hostile page</h1>
    <p class="note">
      The stylesheet of this page tries to hide the overlay. The button below
      removes the host from the document.
    </p>

    <p><a id="target" href="#hostile-target">Hostile page link</a></p>

    <p>
      <button id="remove-host" type="button">Remove the overlay host</button>
      <span class="note">removals: <span id="removals">0</span></span>
    </p>

    <div class="tall"></div>
    <script src="assets/hostile-overlay.js"></script>
  </body>
</html>
