name: CI

on:
  push:
    # `branches` matches branches *only*. Without a `tags` filter a tag push
    # does not start this workflow at all, which made the `release` job below
    # unreachable: its `refs/tags/v` guard could never be true.
    #
    # `master` rather than `**`: a branch push and its pull request fired both
    # triggers on different refs, so the concurrency group could not cancel
    # either and every commit ran every job twice.
    #
    # `master`, and not `main`. This repository has no `main`, so that name
    # matched nothing and no push to the mainline started a run at all.
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A force-push should cancel the run it superseded. A tag run is exempt: it
# publishes, and cancelling it midway can leave a release with one of its two
# assets attached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: "26"

jobs:
  static:
    name: fmt / lint / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm run check

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: userscript
          path: dist/
          if-no-files-found: error

  # A tagged commit becomes the artefact the README's install link points at.
  # Without this the link 404s, which is the state the project shipped in.
  release:
    name: publish the userscript
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [static, unit, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The build derives `@version` from `package.json`, but nothing ties
      # `package.json` to the tag. Tagging v0.2.0 while `package.json` still
      # said 0.1.0 would publish a script whose `@version` is 0.1.0 — and a
      # manager that fetches `@updateURL` and reads back the version it already
      # has does not warn, it just never updates. Every existing install would
      # be stranded silently. Fail before building rather than after
      # publishing.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$declared" ]; then
            echo "::error::tag $TAG does not match package.json version $declared"
            exit 1
          fi

      # The artefact that the `build` job produced, rather than a rebuild.
      - uses: actions/download-artifact@v8
        with:
          name: userscript
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/vimium-webkit.user.js
            dist/vimium-webkit.meta.js
          fail_on_unmatched_files: true
          generate_release_notes: true
