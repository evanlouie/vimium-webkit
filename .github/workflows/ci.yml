name: CI

on:
  push:
    # `branches` matches branches *only*. Without a `tags` filter a tag push
    # does not start this workflow at all, which made the `release` job below
    # unreachable: its `refs/tags/v` guard could never be true.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A force-push should cancel the run it superseded. A tag run is exempt: it
# publishes, and cancelling it midway can leave a release with one of its two
# assets attached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DENO_VERSION: v2.x

jobs:
  # The cheap gates, once. Splitting them out means a formatting slip does not
  # cost three browser installs to discover.
  static:
    name: fmt / lint / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno task fmt:check
      - run: deno task lint
      - run: deno task check
      - run: deno task check:e2e

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno task test

  build:
    name: build + invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno task build
      - uses: actions/upload-artifact@v4
        with:
          name: userscript
          path: dist/
          if-no-files-found: error

  # One job per engine. The suite's whole purpose is cross-engine behaviour, so
  # a matrix that stops at the first failure would hide exactly what it exists
  # to find.
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [static, build]
    strategy:
      fail-fast: false
      matrix:
        project: [webkit, chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # Playwright pins its browser revisions to the npm package version, so
      # keying the cache on the lockfile is exact rather than approximate.
      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('deno.lock') }}

      - name: Install browsers
        run: >-
          deno run -A --node-modules-dir=auto npm:@playwright/test install
          --with-deps ${{ matrix.project }}

      - run: deno task test:e2e --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore

  # A tagged commit becomes the artefact the README's install link points at.
  # Without this the link 404s, which is the state the project shipped in.
  release:
    name: publish the userscript
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [static, unit, build, e2e]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # Build invariant 5 ties `@version` to `deno.json`, but nothing tied
      # `deno.json` to the tag. Tagging v0.2.0 while `deno.json` still said
      # 0.1.0 would publish a script whose `@version` is 0.1.0 — and a manager
      # that fetches `@updateURL` and reads back the version it already has
      # does not warn, it just never updates. Every existing install would be
      # stranded silently. Fail before building rather than after publishing.
      - name: Check the tag matches deno.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared="$(deno eval \
            'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          if [ "$TAG" != "v$declared" ]; then
            echo "::error::tag $TAG does not match deno.json version $declared"
            exit 1
          fi

      - run: deno task build

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vimium-webkit.user.js
            dist/vimium-webkit.meta.js
          fail_on_unmatched_files: true
          generate_release_notes: true
