name: CI

on:
  push:
    # `branches` matches branches *only*. Without a `tags` filter a tag push
    # does not start this workflow at all, which made the `release` job below
    # unreachable: its `refs/tags/v` guard could never be true.
    #
    # `main` rather than `**`: a branch push and its pull request fired both
    # triggers on different refs, so the concurrency group could not cancel
    # either and every commit ran the whole matrix twice.
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A force-push should cancel the run it superseded. A tag run is exempt: it
# publishes, and cancelling it midway can leave a release with one of its two
# assets attached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: "22"

jobs:
  # The cheap gates, once. Splitting them out means a formatting slip does not
  # cost three browser installs to discover.
  static:
    name: fmt / lint / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm run check

  unit:
    # Across Node majors on purpose, and 26 specifically: `node:assert`
    # tightened its argument validation there, which broke the assertion
    # helpers in a way a single pinned version could not see.
    name: unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: build + invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The build executes its own artefact in WebKit before it will pass, so
      # the browser has to be here too. See `build/verify-bundle.ts`.
      # Keyed by browser set. A single key would let the webkit-only jobs
      # populate it first, and `actions/cache` does not save on a hit — so the
      # e2e matrix would re-download chromium and firefox on every run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps webkit

      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: userscript
          path: dist/
          if-no-files-found: error

  # One job per engine. The suite's whole purpose is cross-engine behaviour, so
  # a matrix that stops at the first failure would hide exactly what it exists
  # to find.
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [static, unit, build]
    strategy:
      fail-fast: false
      matrix:
        project: [webkit, chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Playwright pins its browser revisions to the npm package version, so
      # keying the cache on the lockfile is exact rather than approximate.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}

      # WebKit as well as the matrix browser: `globalSetup` builds the bundle
      # if it is stale, and the build executes its own artefact in WebKit.
      # The artefact the `build` job produced and checked, rather than a
      # rebuild. Without this, `globalSetup` finds `dist/` missing and shells
      # out to `npm run build` in every leg — which is also why every leg used
      # to need WebKit on top of its own engine.
      - uses: actions/download-artifact@v4
        with:
          name: userscript
          path: dist/

      # `ensureBundle` rebuilds when `dist/` is older than any source file, and
      # a downloaded artefact's mtime is not guaranteed to beat the checkout's.
      # A rebuild here would also need WebKit, which this leg does not install,
      # so make the freshness explicit rather than relying on extraction order.
      - name: Mark the downloaded bundle as fresh
        run: touch dist/*

      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - run: npm run test:e2e -- --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore

  # A tagged commit becomes the artefact the README's install link points at.
  # Without this the link 404s, which is the state the project shipped in.
  release:
    name: publish the userscript
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [static, unit, build, e2e]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Build invariant 5 ties `@version` to `package.json`, but nothing tied
      # `package.json` to the tag. Tagging v0.2.0 while `package.json` still
      # said 0.1.0 would publish a script whose `@version` is 0.1.0 — and a
      # manager that fetches `@updateURL` and reads back the version it already
      # has does not warn, it just never updates. Every existing install would
      # be stranded silently. Fail before building rather than after
      # publishing.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$declared" ]; then
            echo "::error::tag $TAG does not match package.json version $declared"
            exit 1
          fi

      # Keyed by browser set. A single key would let the webkit-only jobs
      # populate it first, and `actions/cache` does not save on a hit — so the
      # e2e matrix would re-download chromium and firefox on every run.
      # The artefact that the `build` job checked and the `e2e` matrix
      # exercised. Rebuilding here would publish bytes nothing had tested.
      - uses: actions/download-artifact@v4
        with:
          name: userscript
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vimium-webkit.user.js
            dist/vimium-webkit.meta.js
          fail_on_unmatched_files: true
          generate_release_notes: true
